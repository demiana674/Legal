<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة النظام القضائي — تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C8A84B;
      --gold-light: #E8C96A;
      --gold-dim: rgba(200, 168, 75, 0.15);
      --dark: #0A0C12;
      --dark-mid: #10141E;
      --dark-panel: #141824;
      --dark-border: rgba(200, 168, 75, 0.25);
      --text: #E8E4D8;
      --text-dim: #8A8472;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('https://st-takla.org/Gallery/var/albums/Egypt/Modern/www-St-Takla-org--Egyptian-Supreme-Court-01.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      filter: brightness(0.25) saturate(0.6) sepia(0.3);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(10,12,18,0.7) 0%, rgba(10,12,18,0.5) 50%, rgba(10,12,18,0.8) 100%),
        radial-gradient(ellipse at center, rgba(200,168,75,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 2;
    }

    .emblem {
      width: 120px;
      height: 120px;
      margin-bottom: 28px;
    }

    .emblem svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px rgba(200,168,75,0.4));
    }

    .brand-title {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1.3;
      text-shadow: 0 0 40px rgba(200,168,75,0.3);
      text-align: center;
    }

    .login-panel {
      width: 100%;
      max-width: 600px;
      animation: fadeInLeft 0.8s ease 0.2s forwards;
      opacity: 0;
    }

    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .login-card {
      background: var(--dark-panel);
      border: 1px solid var(--dark-border);
      border-radius: 16px;
      padding: 36px 36px 28px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0; left: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 7px;
      letter-spacing: 0.03em;
    }

    .input-wrapper { position: relative; }

    .input-icon {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.95rem;
      pointer-events: none;
      transition: color 0.3s;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: var(--dark-mid);
      border: 1px solid rgba(200,168,75,0.2);
      border-radius: 8px;
      padding: 11px 38px 11px 14px;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      direction: rtl;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(200,168,75,0.1);
    }

    input:focus + .input-icon { color: var(--gold); }
    input::placeholder { color: rgba(138,132,114,0.45); }

    .eye-toggle {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 0.95rem;
      padding: 4px;
      transition: color 0.3s;
    }

    .eye-toggle:hover { color: var(--gold); }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(200,168,75,0.1);
    }

    .btn-login {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: linear-gradient(135deg, var(--gold) 0%, #A8882B 100%);
      border: none;
      border-radius: 8px;
      padding: 13px 22px;
      color: #0A0C12;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.03em;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(200,168,75,0.3);
    }

    .btn-login:active { transform: translateY(0); }

    .register-link {
      text-align: center;
      margin-top: 16px;
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    .register-link a { color: var(--gold); text-decoration: none; }
    .register-link a:hover { opacity: 0.75; }
  </style>
</head>
<body>

<div class="page-wrapper">

  <!-- Logo & Title -->
  <div style="text-align:center;margin-bottom:24px;">
    <div class="emblem" style="margin:0 auto 14px;">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 8 L100 24 L100 60 C100 82 82 98 60 108 C38 98 20 82 20 60 L20 24 Z"
              fill="rgba(200,168,75,0.08)" stroke="#C8A84B" stroke-width="2"/>
        <line x1="60" y1="32" x2="60" y2="80" stroke="#C8A84B" stroke-width="2" stroke-linecap="round"/>
        <line x1="36" y1="46" x2="84" y2="46" stroke="#C8A84B" stroke-width="2" stroke-linecap="round"/>
        <line x1="36" y1="46" x2="30" y2="62" stroke="#C8A84B" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M22 62 Q30 58 38 62 Q30 70 22 62Z" fill="rgba(200,168,75,0.3)" stroke="#C8A84B" stroke-width="1.5"/>
        <line x1="84" y1="46" x2="90" y2="58" stroke="#C8A84B" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M82 58 Q90 54 98 58 Q90 66 82 58Z" fill="rgba(200,168,75,0.3)" stroke="#C8A84B" stroke-width="1.5"/>
        <line x1="48" y1="80" x2="72" y2="80" stroke="#C8A84B" stroke-width="2" stroke-linecap="round"/>
        <circle cx="60" cy="32" r="4" fill="#C8A84B"/>
        <circle cx="30" cy="30" r="2" fill="rgba(200,168,75,0.4)"/>
        <circle cx="90" cy="30" r="2" fill="rgba(200,168,75,0.4)"/>
      </svg>
    </div>
    <div class="brand-title">النظام القضائي الإلكتروني</div>
    <p style="font-size:0.88rem;color:var(--text-dim);text-align:center;margin-top:8px;">منصة متكاملة لإدارة القضايا والملفات القضائية بكل كفاءة وأمان</p>
  </div>

  <!-- Login Panel -->
  <div class="login-panel">
    <div class="login-card">

      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <div class="input-wrapper">
          <input type="email" placeholder="example@email.com">
          <span class="input-icon">✉</span>
        </div>
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <div class="input-wrapper">
          <input type="password" id="pass" placeholder="أدخل كلمة المرور">
          <span class="input-icon">🔒</span>
          <button type="button" class="eye-toggle" onclick="togglePass()">👁</button>
        </div>
      </div>

      <div class="card-footer">
        <button class="btn-login" onclick="handleLogin()">تسجيل الدخول</button>
      </div>

    </div>

    <div class="register-link">ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a></div>
  </div>

</div>

<script>
  function togglePass() {
    const inp = document.getElementById('pass');
    const btn = document.querySelector('.eye-toggle');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? '👁' : '🙈';
  }

  function handleLogin() {
    const btn = document.querySelector('.btn-login');
    btn.textContent = 'جاري التحقق...';
    btn.style.opacity = '0.8';
    setTimeout(() => {
      btn.textContent = '✓ تم تسجيل الدخول';
      btn.style.background = 'linear-gradient(135deg, #4CAF50, #2E7D32)';
      setTimeout(() => {
        btn.textContent = 'تسجيل الدخول';
        btn.style.background = '';
        btn.style.opacity = '';
      }, 2000);
    }, 1500);
  }
</script>
</body>
</html>
