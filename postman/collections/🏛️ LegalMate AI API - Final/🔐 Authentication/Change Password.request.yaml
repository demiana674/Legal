$kind: http-request
url: "{{base_url}}/api/Auth/change-password"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: text
  content: |-
    {
      "currentPassword": "OldPass@123",
      "newPassword": "NewPass@123",
      "confirmPassword": "NewPass@123"
    }
order: 2000
