$kind: http-request
name: "TC-016: Analyze Document Text"
url: "{{baseUrl}}/api/documents/{{documentId}}/analyze"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "extractClauses": true,
      "assessRisks": true,
      "suggestLawyers": false
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test("Status code is 200", function () {
      pm.response.to.have.status(200); });

      pm.test("Response has summary", function () {
      pm.response.json().data.summary !== undefined; });

      pm.test("Response has clauses", function () {
      pm.response.json().data.clauses !== undefined; });

      pm.test("Response has risk", function () { pm.response.json().data.risk
      !== undefined; });
    language: text/javascript
order: 1000
