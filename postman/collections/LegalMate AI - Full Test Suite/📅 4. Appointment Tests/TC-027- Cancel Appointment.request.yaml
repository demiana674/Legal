$kind: http-request
name: "TC-027: Cancel Appointment"
url: "{{baseUrl}}/api/appointments/{{appointmentId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: '"لقد غيرت رأيي"'
scripts:
  - type: afterResponse
    code: pm.test("Status code is 200", function () {
      pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
