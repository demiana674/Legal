$kind: http-request
name: "TC-023: Book Appointment"
url: "{{baseUrl}}/api/appointments"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "lawyerId": "11111111-1111-1111-1111-111111111111",
      "appointmentType": "استشارة قانونية",
      "date": "2026-04-15",
      "time": "10:00 AM",
      "durationMinutes": 60,
      "location": "المكتب الرئيسي",
      "notes": "مراجعة عقد",
      "isUrgent": false
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test("Status code is 200", function () {
      pm.response.to.have.status(200); });

      pm.test("Response has appointmentId", function () {
      pm.response.json().data.id !== undefined; });

      if (pm.response.json().data.id) { pm.environment.set("appointmentId",
      pm.response.json().data.id); }
    language: text/javascript
order: 1000
