$kind: http-request
name: "TC-001: Register New User"
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "firstName": "أحمد",
      "lastName": "محمد",
      "email": "ahmed.{{$timestamp}}@test.com",
      "password": "Test@123456",
      "confirmPassword": "Test@123456",
      "phone": "01234567890",
      "nationalId": "{{$randomInt}}{{ $randomInt}}{{ $randomInt}}",
      "role": "User"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test("Status code is 200", function () {
      pm.response.to.have.status(200); });

      pm.test("Response has userId", function () {
      pm.response.json().data.userId !== undefined; });

      pm.test("Success message", function () {
      pm.expect(pm.response.json().message).to.include("تم تسجيل"); });

      if (pm.response.json().data.userId) { pm.environment.set("userId",
      pm.response.json().data.userId); }
    language: text/javascript
order: 1000
