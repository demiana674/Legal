$kind: http-request
name: "TC-005: Login - Invalid Password"
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "ahmed@test.com",
      "password": "WrongPassword123"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status code is 401", function () {
      pm.response.to.have.status(401); });
    language: text/javascript
order: 5000
