$kind: http-request
name: "TC-004: Login - Valid Credentials"
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "ahmed@test.com",
      "password": "Test@123456"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test("Status code is 200", function () {
      pm.response.to.have.status(200); });

      pm.test("Response has token", function () { pm.response.json().data.token
      !== undefined; });

      pm.test("Response has userId", function () {
      pm.response.json().data.userId !== undefined; });

      pm.test("Response has role", function () { pm.response.json().data.role
      !== undefined; });

      if (pm.response.json().data.token) { pm.environment.set("token",
      pm.response.json().data.token); }

      if (pm.response.json().data.userId) { pm.environment.set("userId",
      pm.response.json().data.userId); }
    language: text/javascript
order: 4000
