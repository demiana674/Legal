$kind: http-request
name: "TC-003: Register User - Weak Password"
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "firstName": "test",
      "lastName": "user",
      "email": "weak@test.com",
      "password": "123",
      "confirmPassword": "123",
      "phone": "01234567890",
      "nationalId": "12345678901234",
      "role": "User"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status code is 400", function () {
      pm.response.to.have.status(400); });
    language: text/javascript
order: 3000
