$kind: http-request
name: "TC-043: Update Availability"
url: "{{baseUrl}}/api/lawyer/availability"
method: PUT
headers:
  Authorization: Bearer {{lawyerToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    [
      {
        "day": 0,
        "startTime": "09:00:00",
        "endTime": "17:00:00",
        "isAvailable": true
      },
      {
        "day": 1,
        "startTime": "09:00:00",
        "endTime": "17:00:00",
        "isAvailable": true
      }
    ]
scripts:
  - type: afterResponse
    code: pm.test("Status code is 200", function () {
      pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
