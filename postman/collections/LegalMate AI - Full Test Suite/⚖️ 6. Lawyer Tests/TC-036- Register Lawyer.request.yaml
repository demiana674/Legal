$kind: http-request
name: "TC-036: Register Lawyer"
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "firstName": "كريم",
      "lastName": "محمود",
      "email": "lawyer{{$timestamp}}@test.com",
      "password": "Test@123456",
      "confirmPassword": "Test@123456",
      "phone": "01234567890",
      "nationalId": "12345678901234",
      "role": "Lawyer",
      "licenseNumber": "LAW-{{$randomInt}}",
      "barAssociation": "نقابة المحامين",
      "yearsOfExperience": 5
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test("Status code is 200", function () {
      pm.response.to.have.status(200); });

      pm.test("Response requires approval", function () {
      pm.expect(pm.response.json().data.requiresApproval).to.be.true; });
    language: text/javascript
order: 1000
