$kind: http-request
name: "TC-069: Get Admin Logs"
url: "{{baseUrl}}/api/admin/logs"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: pm.test("Status code is 200", function () {
      pm.response.to.have.status(200); });
    language: text/javascript
order: 5000
