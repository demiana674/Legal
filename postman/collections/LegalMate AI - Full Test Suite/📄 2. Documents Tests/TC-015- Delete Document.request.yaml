$kind: http-request
name: "TC-015: Delete Document"
url: "{{baseUrl}}/api/documents/{{documentId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: pm.test("Status code is 200", function () {
      pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
