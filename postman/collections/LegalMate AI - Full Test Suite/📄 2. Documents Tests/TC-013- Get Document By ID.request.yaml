$kind: http-request
name: "TC-013: Get Document By ID"
url: "{{baseUrl}}/api/documents/{{documentId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Document ID matches", function () { pm.expect(pm.response.json().data.id).to.eql(pm.environment.get("documentId")); });
    language: text/javascript
order: 3000
