$kind: http-request
name: "TC-008: Upload PDF Document"
url: "{{baseUrl}}/api/documents/upload"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - C:/test/sample.pdf
scripts:
  - type: afterResponse
    code: >-
      pm.test("Status code is 200", function () {
      pm.response.to.have.status(200); });

      pm.test("Response has documentId", function () {
      pm.response.json().data.id !== undefined; });

      if (pm.response.json().data.id) { pm.environment.set("documentId",
      pm.response.json().data.id); }
    language: text/javascript
order: 1000
